plugins {
    id 'java'
}

sourceSets {
    api {
        java.srcDir 'script-api/src/main/java'
    }
    loader {
        java.srcDir 'loader/src/main/java'
    }
    bootstrap {
        java.srcDir 'bootstrap/src/main/java'
    }
    example {
        java.srcDir 'scripts/example/src/main/java'
    }
    combat {
        java.srcDir 'scripts/combat/src/main/java'
    }
    selfTest {
        java.srcDir 'tests/src/main/java'
    }
}

sourceSets.loader.compileClasspath += sourceSets.api.output
sourceSets.bootstrap.compileClasspath += sourceSets.api.output + sourceSets.loader.output
sourceSets.example.compileClasspath += sourceSets.api.output
sourceSets.combat.compileClasspath += sourceSets.api.output
sourceSets.selfTest.compileClasspath += sourceSets.api.output
sourceSets.selfTest.runtimeClasspath += sourceSets.api.output + sourceSets.selfTest.output
sourceSets.selfTest.runtimeClasspath += sourceSets.combat.output

tasks.named('compileApiJava', JavaCompile) {
    options.release = 11
}

tasks.named('compileLoaderJava', JavaCompile) {
    dependsOn tasks.named('compileApiJava')
    options.release = 11
}

tasks.named('compileBootstrapJava', JavaCompile) {
    dependsOn tasks.named('compileApiJava'), tasks.named('compileLoaderJava')
    options.release = 8
}

tasks.named('compileExampleJava', JavaCompile) {
    dependsOn tasks.named('compileApiJava')
    options.release = 11
}

tasks.named('compileCombatJava', JavaCompile) {
    dependsOn tasks.named('compileApiJava')
    options.release = 11
}

tasks.named('compileSelfTestJava', JavaCompile) {
    dependsOn tasks.named('compileApiJava')
    options.release = 11
}

def distDir = layout.projectDirectory.dir('dist')
def scriptsDistDir = layout.projectDirectory.dir('dist/scripts')

tasks.register('loaderJar', Jar) {
    dependsOn tasks.named('compileApiJava'),
              tasks.named('compileLoaderJava'),
              tasks.named('compileBootstrapJava')
    archiveFileName = 'RuneForge-Loader.jar'
    destinationDirectory = distDir
    from sourceSets.api.output
    from sourceSets.loader.output
    from sourceSets.bootstrap.output
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Premain-Class': 'io.runeforge.loader.RuneForgeBootstrap'
        )
    }
}

tasks.register('exampleJar', Jar) {
    dependsOn tasks.named('compileExampleJava')
    archiveFileName = 'RuneForge-Example.jar'
    destinationDirectory = scriptsDistDir
    from sourceSets.example.output
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Rune-Forge-Script-Class': 'io.runeforge.scripts.example.ExampleScript'
        )
    }
}

tasks.register('combatJar', Jar) {
    dependsOn tasks.named('compileCombatJava')
    archiveFileName = 'RuneForge-Combat.jar'
    destinationDirectory = scriptsDistDir
    from sourceSets.combat.output
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Rune-Forge-Script-Class': 'io.runeforge.scripts.combat.CombatScript'
        )
    }
}

tasks.register('selfTest', JavaExec) {
    dependsOn tasks.named('compileSelfTestJava'), tasks.named('compileCombatJava')
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'io.runeforge.tests.RuneForgeSelfTest'
}

tasks.register('combatDiagnosticsTest', JavaExec) {
    dependsOn tasks.named('compileSelfTestJava'), tasks.named('compileCombatJava')
    classpath = sourceSets.selfTest.runtimeClasspath
    mainClass = 'io.runeforge.tests.CombatDiagnosticsTest'
}

tasks.register('cleanDist', Delete) {
    delete layout.projectDirectory.dir('dist')
}

tasks.named('clean') {
    dependsOn tasks.named('cleanDist')
}

tasks.named('assemble') {
    dependsOn tasks.named('loaderJar'),
              tasks.named('exampleJar'),
              tasks.named('combatJar')
}

tasks.named('check') {
    dependsOn tasks.named('selfTest')
    dependsOn tasks.named('combatDiagnosticsTest')
}
