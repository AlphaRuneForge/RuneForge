name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and test
        run: gradle build

      - name: Build Windows release
        shell: powershell
        run: .\packaging\package-release.ps1 -SkipBuild

      - name: Audit release contents
        shell: powershell
        run: .\packaging\audit-release.ps1 -ReleaseZip .\build\Rune-Forge-v1.0.4-Windows.zip
