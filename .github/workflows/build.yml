name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test through Gradle Wrapper
        shell: powershell
        run: .\gradlew.bat clean build

      - name: Build Windows release
        shell: powershell
        run: .\packaging\package-release.ps1 -SkipBuild

      - name: Audit release contents
        shell: powershell
        run: .\packaging\audit-release.ps1 -ReleaseZip .\build\Rune-Forge-v1.0.5-Windows.zip
